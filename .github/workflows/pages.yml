name: Pages

# Build docs/ into a static artifact and deploy it for release tags.  A manual
# run is available for a documentation-only deployment.  The build is gated by
# the same check-site target that validates the generated links and anchors.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue releases instead of cancelling a deployment a reader may be opening.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Init submodules
        run: make submodules

      - name: Install Chez and cmark-gfm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends chezscheme cmark-gfm xz-utils

      - name: Get chez-cmark-gfm as Akku.lock pins it
        run: make site-deps

      - name: Gate the site
        run: make check-site CHEZ=chezscheme SITE_REF="${GITHUB_REF_NAME}"

      - name: Build the site
        run: make site CHEZ=chezscheme SITE_REF="${GITHUB_REF_NAME}"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
